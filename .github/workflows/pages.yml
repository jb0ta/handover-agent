name: Deploy demo

# Publishes the static preview of the review UI to GitHub Pages.
#
# What is deployed is the same src/ui/index.html the gate server serves, with
# no server behind it: the page falls back to its built-in fictional sample and
# says so in a banner. The approval gate itself is NOT deployed and must not be
# — it has no authentication and binds to loopback (see docs/threat-model.md,
# T4).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the static demo
        run: npm run demo:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
